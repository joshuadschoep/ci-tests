name: Create Development Package
on:
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Calculate Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
  package:
    name: Package ${{ needs.setup.outputs.sha_short }}
    needs: setup
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      checks: write
      contents: read
    steps:
      # - name: Create package PR checks entry
      #   uses: LouisBrunner/checks-action@v3.1.0
      #   id: release_candidate_check
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     name: Generating release candidate version
      #     status: in_progress
      - name: Wait
        id: generate_tag
        run: |
          sleep 5
          echo "DEV_TAG_NAME=0.8.5-rc.1234abcd" >> $GITHUB_OUTPUT
      - name: Generate Output
        uses: LouisBrunner/checks-action@v1.6.2
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # check_id: ${{ steps.release_candidate_check.outputs.check_id }}
          name: Release Candidate ${{ steps.generate_tag.outputs.DEV_TAG_NAME }}
          conclusion: ${{ job.status }}
          output: |
            {
              "title": "Release Candidate ${{ steps.generate_tag.outputs.DEV_TAG_NAME }}",
              "summary": "Release Candidate ${{ steps.generate_tag.outputs.DEV_TAG_NAME }}"
            }
