name: Release Candidate
on:
  pull_request:
    branches: [main]

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Create package PR checks entry
      #   uses: LouisBrunner/checks-action@v3.1.0
      #   id: release_candidate_check
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     name: Generating release candidate version
      #     status: in_progress
      - name: Wait
        id: generate_tag
        run: |
          sleep 5
          echo "DEV_TAG_NAME=0.8.5-rc.$( git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Generate Output
        uses: LouisBrunner/checks-action@v1.6.2
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # check_id: ${{ steps.release_candidate_check.outputs.check_id }}
          name: Released @fnb/fnb-lib@${{ steps.generate_tag.outputs.DEV_TAG_NAME }}
          conclusion: ${{ job.status }}
          output: |
            {
              "title": "Release Candidate Generated",
              "summary": "A release candidate version has been created from HEAD. If not, check job logs for the failure reason. Install this release with\n```npm install @fnb/fnb-lib@${{ steps.generate_tag.outputs.DEV_TAG_NAME }}```"
            }
